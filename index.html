
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>break the pattern</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    button {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      max-width: 100%;
    }

    button:disabled {
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <button id="artwork" type="button" aria-label="Play music">
    <img src="break_the_cycle.png" alt="start anew">
  </button>

  <audio id="music" src="tension.mp3" preload="auto" loop></audio>

  <script>
    const artwork = document.getElementById("artwork");
    const music = document.getElementById("music");

    artwork.addEventListener("click", () => {
      artwork.disabled = true;
      music.play().catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
